name: tests
on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master

jobs:
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          submodules: true
      - name: Use Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          # renovate: datasource=node-version packagename=node
          node-version: '24.20.0'
      - name: Install dependencies
        run: npm ci && npm run postinstall
      - name: Run tests
        run: npm test
  backend:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - name: Setup Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          # renovate: datasource=golang-version depName=go
          go-version: '1.27.1'
      - name: Check Go module vendoring
        working-directory: ./backend
        run: |
          go mod tidy
          go mod vendor
          go mod verify
          test -z "$(git status --porcelain)" || (echo "please run 'go mod tidy && go mod vendor', and submit your changes"; exit 1)
      - name: Run Go static checks
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          working-directory: ./backend
          # renovate: datasource=github-releases depName=golangci/golangci-lint
          version: v2.13.2
          args: --config=.golangci.yml
          skip-cache: true
      - name: Setup Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          # renovate: datasource=node-version packagename=node
          node-version: '24.20.0'
      - name: Install NPM dependencies
        run: npm ci && npm run postinstall
      - name: npm run prettier
        run: |
          npm run prettier
          git status --porcelain
          test -z "$(git status --porcelain)" || (echo "please run `npm run prettier` and submit changes"; exit 1)
      - name: npm run lint
        run: npm run lint
      - name: Check proto files
        working-directory: ./backend
        run: |
          ./ctl.sh update-proto
          test -z "$(git status --porcelain)" || (echo "please run './ctl.sh update-proto', and submit your changes"; exit 1)
